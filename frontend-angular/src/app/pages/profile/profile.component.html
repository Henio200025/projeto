<div class="min-h-screen bg-background">
  <div class="max-w-4xl mx-auto px-4 py-20">
    <!-- Header -->
    <div class="flex items-center justify-between mb-8">
      <h1 class="text-4xl font-bold">Meu Perfil</h1>
      <button
        (click)="logout()"
        class="px-4 py-2 border rounded-lg hover:bg-muted transition-colors"
      >
        Sair
      </button>
    </div>

    <!-- Profile Card -->
    <div class="bg-white border rounded-lg shadow-lg p-8">
      <!-- Email Display -->
      <div class="mb-6 pb-6 border-b">
        <p class="text-sm text-muted-foreground mb-1">Email cadastrado</p>
        <p class="text-lg font-medium">{{ currentUser?.email }}</p>
      </div>

      <!-- Edit Form -->
      <form *ngIf="profileForm" [formGroup]="profileForm" (ngSubmit)="saveProfile()" class="space-y-6">
        <!-- Nome -->
        <div>
          <label class="block text-sm font-medium mb-2">
            Nome Completo
          </label>
          <input
            type="text"
            formControlName="name"
            [readonly]="!isEditing"
            class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-600"
            [class.bg-muted]="!isEditing"
          />
        </div>

        <!-- Apelido -->
        <div>
          <label class="block text-sm font-medium mb-2">
            Apelido (exibido como usuário)
          </label>
          <input
            type="text"
            formControlName="nickname"
            [readonly]="!isEditing"
            class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-600"
            [class.bg-muted]="!isEditing"
            placeholder="Como você quer ser chamado"
          />
          <p class="text-xs text-muted-foreground mt-1">Este é o nome que aparecerá na barra de navegação</p>
        </div>

        <!-- Telefone -->
        <div>
          <label class="block text-sm font-medium mb-2">
            Telefone
          </label>
          <input
            type="tel"
            formControlName="phone"
            [readonly]="!isEditing"
            class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-600"
            [class.bg-muted]="!isEditing"
            placeholder="(00) 00000-0000"
          />
        </div>

        <!-- Bio -->
        <div>
          <label class="block text-sm font-medium mb-2">
            Bio (Opcional)
          </label>
          <textarea
            formControlName="bio"
            [readonly]="!isEditing"
            class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-600 resize-none"
            [class.bg-muted]="!isEditing"
            rows="4"
            placeholder="Conte um pouco sobre você..."
          ></textarea>
        </div>

        <!-- Action Buttons -->
        <div class="flex gap-3 pt-4">
          <ng-container *ngIf="!isEditing">
            <button
              type="button"
              (click)="toggleEdit()"
              class="flex-1 px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition-colors font-medium"
            >
              Editar Perfil
            </button>
          </ng-container>
          <ng-container *ngIf="isEditing">
            <button
              type="submit"
              [disabled]="profileForm.invalid || isSaving"
              class="flex-1 px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors font-medium"
            >
              <span *ngIf="!isSaving">Salvar Alterações</span>
              <span *ngIf="isSaving">Salvando...</span>
            </button>
            <button
              type="button"
              (click)="toggleEdit()"
              class="flex-1 px-4 py-2 border rounded-lg hover:bg-muted transition-colors font-medium"
            >
              Cancelar
            </button>
          </ng-container>
        </div>
      </form>
    </div>

    <!-- Role Badge -->
    <div class="mt-8 bg-blue-50 border border-blue-200 rounded-lg p-4">
      <p class="text-sm text-blue-800">
        <span class="font-semibold">Tipo de conta:</span>
        {{ currentUser?.role === 'admin' ? 'Administrador' : 'Usuário Comum' }}
      </p>
    </div>
  </div>
</div>
