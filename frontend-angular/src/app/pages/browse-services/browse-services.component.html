<div class="min-h-screen bg-background flex">
  <!-- Sidebar Toggle Button (Left) -->
  <button 
    (click)="toggleSidebar()"
    class="fixed left-0 top-1/2 -translate-y-1/2 z-40 bg-purple-600 text-white p-2 rounded-r-lg hover:bg-purple-700 transition-colors"
    aria-label="Toggle sidebar"
  >
    <svg *ngIf="!sidebarOpen" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor">
      <polyline points="9 18 15 12 9 6"></polyline>
    </svg>
    <svg *ngIf="sidebarOpen" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor">
      <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
  </button>

  <!-- Sidebar (Categories) -->
  <div 
    [class.hidden]="!sidebarOpen"
    class="fixed left-0 top-0 h-full w-64 bg-white border-r shadow-lg z-30 pt-20 overflow-y-auto transition-transform"
  >
    <div class="p-6">
      <h2 class="text-xl font-bold mb-6 text-purple-600">Categorias</h2>
      <div class="space-y-3">
        <app-category-card [category]="{ id: 0, name: 'Todas', icon: '✨', count: categories.length }" [active]="!selectedCategory" (select)="clearCategory()"></app-category-card>
        <app-category-card *ngFor="let c of categories" [category]="c" [active]="selectedCategory===c.name" (select)="selectCategory(c)"></app-category-card>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <div class="flex-1" [class.ml-64]="sidebarOpen">
    <!-- Header with Search -->
    <div class="bg-white border-b p-6">
      <h1 class="text-3xl font-bold mb-6">Explorar Serviços</h1>
      
      <!-- Search Bar -->
      <form (submit)="onSearch($event)" class="mb-4">
        <div class="flex gap-2">
          <div class="flex-1 relative">
            <input 
              [(ngModel)]="searchQuery" 
              name="searchQuery"
              type="text"
              class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-600"
              placeholder="Pesquisar serviços..."
            />
          </div>
          <button 
            type="submit"
            class="px-6 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition-colors font-medium"
          >
            Buscar
          </button>
        </div>
      </form>

      <!-- Filter Button -->
      <div class="flex items-center gap-2 relative">
        <button 
          (click)="toggleFilters()"
          class="flex items-center gap-2 px-4 py-2 border rounded-lg hover:bg-muted transition-colors"
        >
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
          </svg>
          Filtros
        </button>
        
        <!-- Filter Options (Hidden by default) -->
        <div *ngIf="showFilters" class="absolute left-0 top-full mt-2 bg-white border rounded-lg shadow-lg p-4 min-w-max z-50">
          <div class="grid grid-cols-1 gap-3">
            <div class="flex gap-2 items-center">
              <label class="w-24 text-sm">Preço:</label>
              <input name="minPrice" type="number" class="form-input" placeholder="Mín" [(ngModel)]="filters.minPrice">
              <input name="maxPrice" type="number" class="form-input" placeholder="Máx" [(ngModel)]="filters.maxPrice">
            </div>

            <div class="flex gap-2 items-center">
              <label class="w-24 text-sm">Avaliação:</label>
              <select name="minRating" [(ngModel)]="filters.minRating" class="form-input w-32">
                <option [ngValue]="null">Qualquer</option>
                <option [ngValue]="5">5+</option>
                <option [ngValue]="4">4+</option>
                <option [ngValue]="3">3+</option>
              </select>
            </div>

            <div class="flex gap-2 items-center">
              <label class="w-24 text-sm">Prazo:</label>
              <select name="deliveryTime" [(ngModel)]="filters.deliveryTime" class="form-input w-48">
                <option [ngValue]="null">Qualquer</option>
                <option value="1 dia">1 dia</option>
                <option value="2 dias">2 dias</option>
                <option value="7 dias">7 dias</option>
              </select>
            </div>

            <div class="flex gap-2 items-center">
              <label class="w-24 text-sm">Ordenar por:</label>
              <select name="sortBy" [(ngModel)]="filters.sortBy" class="form-input w-48">
                <option [ngValue]="null">Padrão</option>
                <option value="price_asc">Preço: menor</option>
                <option value="price_desc">Preço: maior</option>
                <option value="rating_desc">Avaliação</option>
                <option value="newest">Mais recentes</option>
              </select>
            </div>

            <div class="flex items-center gap-2">
              <input name="onlyAvailable" type="checkbox" id="onlyAvailable" [(ngModel)]="filters.onlyAvailable">
              <label for="onlyAvailable" class="text-sm">Apenas disponíveis</label>
            </div>

            <div class="flex gap-2 justify-end mt-2">
              <button (click)="applyFilters()" class="px-3 py-1 bg-primary text-white rounded">Aplicar</button>
              <button (click)="clearFilters()" class="px-3 py-1 border rounded">Limpar</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Services Grid -->
    <div class="p-6">
      <div class="flex items-center justify-between mb-4">
        <div class="text-sm text-muted-foreground">Resultados: {{ total }}</div>
        <div class="text-sm text-muted-foreground">Página {{ page }}</div>
      </div>

      <div *ngIf="loading" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <div *ngFor="let i of [1,2,3,4,5,6]" class="p-4 border rounded-lg bg-white animate-pulse">
          <div class="h-32 bg-muted rounded mb-3"></div>
          <div class="h-4 bg-muted rounded w-3/4 mb-2"></div>
          <div class="h-3 bg-muted rounded w-1/2 mb-4"></div>
          <div class="flex items-center justify-between">
            <div class="h-6 w-24 bg-muted rounded"></div>
            <div class="h-8 w-24 bg-muted rounded"></div>
          </div>
        </div>
      </div>

      <div *ngIf="!loading && services.length > 0" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <app-service-card *ngFor="let service of services" [service]="service" (open)="goToService($event)"></app-service-card>
      </div>

      <div *ngIf="!loading && services.length === 0" class="p-8 border rounded-lg bg-muted/30 text-center">
        <p class="text-muted-foreground">Nenhum serviço encontrado com os critérios informados.</p>
      </div>

      <!-- Pagination -->
      <div class="mt-6 flex items-center justify-center gap-3">
        <button (click)="changePage(false)" [disabled]="page<=1" class="px-4 py-2 border rounded disabled:opacity-50 btn-animated">Anterior</button>
        <button (click)="changePage(true)" [disabled]="page*perPage>=total" class="px-4 py-2 bg-primary text-white rounded disabled:opacity-50 btn-animated">Próxima</button>
      </div>
    </div>
  </div>
</div>
