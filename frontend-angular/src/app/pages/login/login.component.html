<div class="min-h-screen bg-gradient-to-b from-background via-muted/20 to-background flex items-center justify-center px-4">
  <div class="w-full max-w-md">
    <!-- Card de login -->
    <div class="bg-white border rounded-lg shadow-lg p-8">
      <!-- Logo -->
      <div class="flex justify-center mb-8">
        <div class="w-12 h-12 rounded-lg bg-primary text-primary-foreground flex items-center justify-center font-bold text-2xl">F</div>
      </div>

      <!-- Título -->
      <h1 class="text-2xl font-bold text-center mb-2">FreelanceHub</h1>
      <p class="text-center text-muted-foreground mb-8">Entre com sua conta para continuar</p>

      <!-- Formulário de login -->
      <form [formGroup]="loginForm" (ngSubmit)="onLogin()" class="space-y-4">
        <!-- Email -->
        <div>
          <label for="email" class="block text-sm font-medium text-foreground mb-1">
            E-mail
          </label>
          <input
            id="email"
            type="email"
            formControlName="email"
            class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary"
            placeholder="seu@email.com"
            [class.border-red-500]="isFieldInvalid('email')"
          />
          <span *ngIf="isFieldInvalid('email')" class="text-red-500 text-xs mt-1 block">
            {{ getFieldError('email') }}
          </span>
        </div>

        <!-- Senha -->
        <div>
          <label for="password" class="block text-sm font-medium text-foreground mb-1">
            Senha
          </label>
          <input
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary"
            placeholder="••••••••"
            [class.border-red-500]="isFieldInvalid('password')"
          />
          <span *ngIf="isFieldInvalid('password')" class="text-red-500 text-xs mt-1 block">
            {{ getFieldError('password') }}
          </span>
        </div>

        <!-- Tipo de usuário (Role) -->
        <div>
          <label class="block text-sm font-medium text-foreground mb-2">
            Tipo de Conta
          </label>
          <div class="flex gap-4">
            <label class="flex items-center gap-2 cursor-pointer">
              <input
                type="radio"
                formControlName="role"
                value="user"
                class="w-4 h-4"
              />
              <span class="text-sm">Usuário</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
              <input
                type="radio"
                formControlName="role"
                value="admin"
                class="w-4 h-4"
              />
              <span class="text-sm">Administrador</span>
            </label>
          </div>
        </div>

        <!-- Mensagem de erro geral -->
        <div *ngIf="error" class="bg-red-50 border border-red-200 text-red-800 text-sm px-4 py-3 rounded-lg">
          {{ error }}
        </div>

        <!-- Botão de login -->
        <button
          type="submit"
          [disabled]="loginForm.invalid || isLoading"
          class="w-full bg-primary text-white font-medium py-2 rounded-lg hover:bg-primary/90 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
        >
          <span *ngIf="!isLoading">Entrar</span>
          <span *ngIf="isLoading">Entrando...</span>
        </button>
      </form>

      <!-- Divisor -->
      <div class="my-6 relative">
        <div class="absolute inset-0 flex items-center">
          <div class="w-full border-t"></div>
        </div>
        <div class="relative flex justify-center text-xs uppercase">
          <span class="px-2 bg-white text-muted-foreground">ou</span>
        </div>
      </div>

      <!-- Demo credentials -->
      <div class="bg-blue-50 border border-blue-200 rounded-lg p-4 text-sm text-blue-800 space-y-1">
        <p class="font-semibold">Credenciais de Demo:</p>
        <p>Usuário: user@example.com / 123456</p>
        <p>Admin: admin@example.com / 123456</p>
      </div>

      <!-- Link de registro (opcional) -->
      <p class="text-center text-sm text-muted-foreground mt-6">
        Não tem uma conta?
        <a routerLink="/register" class="text-primary hover:underline font-medium">
          Cadastre-se
        </a>
      </p>
    </div>

    <!-- Rodapé de segurança -->
    <p class="text-center text-xs text-muted-foreground mt-6">
      Seus dados estão seguros e criptografados.
    </p>
  </div>
</div>
