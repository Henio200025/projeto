<button (click)="onSelect()" class="p-4 text-left border rounded-lg hover:border-primary transition-colors w-full flex items-center justify-between" [class.bg-primary/10]="active">
  <div class="flex items-center gap-3">
    <div class="w-10 h-10 flex items-center justify-center rounded bg-muted text-xl">{{ category.icon }}</div>
    <div class="text-sm">
      <div class="font-semibold">{{ category.name }}</div>
      <div class="text-xs text-muted-foreground">{{ category.count }} serviços</div>
    </div>
  </div>
  <div class="text-xs text-muted-foreground">→</div>
</button>
