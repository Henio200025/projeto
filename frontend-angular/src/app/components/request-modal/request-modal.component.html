<div *ngIf="open" class="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-lg w-full max-w-2xl p-6">
    <div class="flex items-center justify-between mb-4">
      <h3 class="text-lg font-semibold">Pedir Orçamento — {{ serviceTitle }}</h3>
      <button (click)="close()" aria-label="Fechar" class="text-sm px-2 py-1">✕</button>
    </div>

    <div *ngIf="step === 1">
      <p class="text-sm text-muted-foreground mb-3">Descreva o seu pedido com o máximo de detalhes.</p>
      <textarea [(ngModel)]="message" rows="6" class="w-full border rounded p-2 mb-3" placeholder="Ex.: Preciso de conserto de vazamento na cozinha, material incluso?"></textarea>
      <div class="flex items-center justify-end gap-2">
        <button (click)="close()" class="px-4 py-2 border rounded">Cancelar</button>
        <button (click)="next()" class="px-4 py-2 bg-primary text-white rounded btn-animated">Próximo</button>
      </div>
    </div>

    <div *ngIf="step === 2">
      <p class="text-sm text-muted-foreground mb-3">Confirme os dados antes de enviar</p>
      <div class="p-3 border rounded mb-3">
        <div class="font-medium">Serviço</div>
        <div class="text-sm text-muted-foreground">{{ serviceTitle }}</div>
      </div>
      <div class="p-3 border rounded mb-3">
        <div class="font-medium">Mensagem</div>
        <div class="text-sm text-muted-foreground">{{ message || 'Sem mensagem' }}</div>
      </div>
      <div class="flex items-center justify-between">
        <div>
          <button (click)="prev()" class="px-4 py-2 border rounded">Voltar</button>
        </div>
        <div>
          <button (click)="submit()" [disabled]="submitting" class="px-4 py-2 bg-primary text-white rounded btn-animated">Enviar pedido</button>
        </div>
      </div>
    </div>

    <div *ngIf="step === 3" class="text-center">
      <div class="text-lg font-semibold mb-3">Pedido enviado com sucesso!</div>
      <div class="text-sm text-muted-foreground mb-4">O profissional será notificado e responderá em breve.</div>
      <div class="flex items-center justify-center">
        <button (click)="close()" class="px-4 py-2 bg-primary text-white rounded btn-animated">Fechar</button>
      </div>
    </div>
  </div>
</div>
