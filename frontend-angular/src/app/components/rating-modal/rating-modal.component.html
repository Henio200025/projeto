<div class="modal-overlay" (click)="close()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <!-- Header -->
    <div class="modal-header">
      <h2>Avaliar Serviço</h2>
      <button class="btn-close" (click)="close()" aria-label="Fechar">×</button>
    </div>

    <!-- Body -->
    <div class="modal-body">
      <div class="freelancer-info">
        <p class="label">Freelancer:</p>
        <p class="value">{{ freelancerName }}</p>
      </div>

      <div class="service-info">
        <p class="label">Serviço:</p>
        <p class="value">{{ serviceName }}</p>
      </div>

      <!-- Rating Stars -->
      <div class="rating-section">
        <p class="label">Qual foi sua experiência?</p>
        <div class="stars-container">
          <button 
            *ngFor="let i of [1, 2, 3, 4, 5]"
            [ngClass]="getStarClass(i - 1)"
            (click)="setScore(i)"
            class="star-btn"
            [title]="i + ' estrela(s)'"
            [disabled]="isLoading()">
            ★
          </button>
        </div>
        <p class="rating-label" *ngIf="score() > 0">
          {{ score() }} 
          <span *ngIf="score() === 1">estrela</span>
          <span *ngIf="score() !== 1">estrelas</span>
        </p>
      </div>

      <!-- Comment -->
      <div class="comment-section">
        <label for="comment" class="label">Deixe um comentário (opcional)</label>
        <textarea
          id="comment"
          [(ngModel)]="comment"
          [disabled]="isLoading()"
          placeholder="Conte-nos sobre sua experiência com este freelancer..."
          class="comment-input"
          rows="4"></textarea>
        <p class="char-count">{{ comment().length }} / 500 caracteres</p>
      </div>

      <!-- Error -->
      <div *ngIf="error()" class="error-message">
        <p>{{ error() }}</p>
      </div>
    </div>

    <!-- Footer -->
    <div class="modal-footer">
      <button 
        (click)="close()"
        [disabled]="isLoading()"
        class="btn-secondary">
        Pular
      </button>
      <button
        (click)="submitRating()"
        [disabled]="isLoading() || score() === 0"
        class="btn-primary">
        <span *ngIf="!isLoading()">Enviar Avaliação</span>
        <span *ngIf="isLoading()">Enviando...</span>
      </button>
    </div>
  </div>
</div>
