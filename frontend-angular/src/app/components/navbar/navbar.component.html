<nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-lg border-b">
  <div class="max-w-7xl mx-auto px-4">
    <div class="flex items-center justify-between h-16">
      <!-- Logo -->
      <a routerLink="/" class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-purple-600 text-white flex items-center justify-center font-bold text-lg">M</div>
        <span class="text-xl font-bold hidden sm:inline"><span class="text-purple-600">Uma</span><span class="text-black">Maozinha</span></span>
      </a>

      <!-- Desktop Navigation -->
      <div class="hidden md:flex items-center gap-6">
        <a *ngFor="let link of navLinks" [routerLink]="link.path" class="text-sm font-medium text-muted-foreground hover:text-foreground transition-colors">
          {{ link.label }}
        </a>
      </div>

      <!-- Right Side Actions -->
      <div class="flex items-center gap-3">
        <ng-container *ngIf="isLoggedIn; else loggedOut">
          <button class="relative hidden sm:inline-flex" aria-label="Notificações">
            <!-- bell icon placeholder -->
            <span class="sr-only">Notificações</span>
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="#333"/></svg>
            <span *ngIf="unreadMessages > 0" class="absolute -top-1 -right-1 w-5 h-5 flex items-center justify-center p-0 text-xs bg-red-600 text-white rounded-full">{{ unreadMessages }}</span>
          </button>

          <button class="relative hidden sm:inline-flex" routerLink="/messages" aria-label="Mensagens">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="12" stroke="#333"/></svg>
            <span *ngIf="unreadMessages > 0" class="absolute -top-1 -right-1 w-5 h-5 flex items-center justify-center p-0 text-xs bg-red-600 text-white rounded-full">{{ unreadMessages }}</span>
          </button>

          <!-- User avatar dropdown -->
          <div class="relative">
            <button 
              routerLink="/profile"
              class="rounded-full flex items-center gap-2 px-2 py-1 hover:bg-muted rounded-lg transition-colors" 
              aria-label="Perfil do usuário"
            >
              <div class="w-8 h-8 rounded-full bg-purple-600 text-white flex items-center justify-center text-xs font-bold">
                {{ (currentUser?.nickname || currentUser?.email)?.charAt(0)?.toUpperCase() || 'U' }}
              </div>
              <span class="hidden sm:inline text-sm font-medium">{{ currentUser?.nickname || currentUser?.email }}</span>
            </button>
          </div>

          <!-- Logout button -->
          <button 
            class="hidden sm:inline-flex px-3 py-2 text-sm border rounded hover:bg-muted transition-colors"
            (click)="logout()"
          >
            Sair
          </button>
        </ng-container>
        <ng-template #loggedOut>
          <button class="text-sm px-3 py-2 hover:bg-muted rounded transition-colors" routerLink="/login">
            Entrar
          </button>
          <button class="text-sm px-3 py-2 bg-primary text-white rounded hover:bg-primary/90 transition-colors" routerLink="/login">
            Cadastre-se
          </button>
        </ng-template>

        <!-- Mobile Menu Toggle -->
        <button class="md:hidden" (click)="toggleMobile()" aria-label="Toggle menu">
          <svg *ngIf="!mobileMenuOpen" class="w-5 h-5" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="2"/><rect x="3" y="11" width="18" height="2"/><rect x="3" y="16" width="18" height="2"/></svg>
          <svg *ngIf="mobileMenuOpen" class="w-5 h-5" viewBox="0 0 24 24"><line x1="4" y1="4" x2="20" y2="20" stroke="#000"/><line x1="20" y1="4" x2="4" y2="20" stroke="#000"/></svg>
        </button>
      </div>
    </div>

    <!-- Mobile Menu -->
    <div *ngIf="mobileMenuOpen" class="md:hidden py-4 border-t">
      <div class="flex flex-col gap-3">
        <a *ngFor="let link of navLinks" [routerLink]="link.path" (click)="toggleMobile()" class="text-sm font-medium text-muted-foreground hover:text-foreground transition-colors py-2">{{ link.label }}</a>
        <ng-container *ngIf="isLoggedIn; else mobileLoggedOut">
          <button class="w-full text-left px-3 py-2 text-sm hover:bg-muted rounded transition-colors" routerLink="/messages" (click)="toggleMobile()">
            Mensagens
          </button>
          <button class="w-full text-left px-3 py-2 text-sm hover:bg-muted rounded transition-colors" (click)="logout()">
            Sair
          </button>
        </ng-container>
        <ng-template #mobileLoggedOut>
          <button class="w-full text-left px-3 py-2 text-sm hover:bg-muted rounded transition-colors" routerLink="/login" (click)="toggleMobile()">
            Entrar
          </button>
          <button class="w-full text-left px-3 py-2 text-sm bg-primary text-white rounded transition-colors" routerLink="/login" (click)="toggleMobile()">
            Cadastre-se
          </button>
        </ng-template>
      </div>
    </div>
  </div>
</nav>
